[workspace]
resolver = "3"
members = [
    "crates/pc-proto",
    "crates/pc-agent",
    "crates/pc-coordinator",
    "tools/mock-llama",
    "apps/desktop",
]

# La app de Mac necesita android/dist (tools/build-android.sh): se compila
# aparte con `cargo tauri build` o `cargo build -p phone-cluster-desktop`.
default-members = [
    "crates/pc-proto",
    "crates/pc-agent",
    "crates/pc-coordinator",
    "tools/mock-llama",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
pc-proto = { path = "crates/pc-proto" }
pc-agent = { path = "crates/pc-agent" }
mock-llama = { path = "tools/mock-llama" }

anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
futures = "0.3.34"
# Sin TLS: todo el tráfico es HTTP en la LAN (ver DECISIONS.md, D-03).
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde-well-known", "formatting", "parsing"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "signal"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", features = ["trace", "fs"] }
tower = { version = "0.5", features = ["util"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["serde", "v4", "v5"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
